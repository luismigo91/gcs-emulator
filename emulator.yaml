# GCP Emulator Configuration
# All fields optional — defaults shown below

port: 9090
default_project: test-project

storage:
  mode: memory
  path: ./data/gcs
  flush_interval: 5s

pubsub:
  mode: memory
  path: ./data/pubsub

seed_path: /data

